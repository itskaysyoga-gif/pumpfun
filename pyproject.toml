[project]
name = "pumplab"
version = "0.1.0"
description = "Research lab that tests pump.fun trading rules on real data before any money is risked"
requires-python = ">=3.12"
dependencies = [
    "websockets==15.0.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "polars==1.31.0",
    "pyarrow==20.0.0",
    "duckdb==1.3.2",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pumplab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
